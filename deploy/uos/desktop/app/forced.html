<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>需要更新后才能继续使用</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #0f1115; color: #e6e8ee;
      font: 14px/1.7 "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card { width: 620px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #3a1d1d; color: #ff8b8b; font-size: 12px; margin-bottom: 14px; }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 6px 0; color: #a8b0c2; }
    table { margin: 18px 0; border-collapse: collapse; }
    td { padding: 4px 0; }
    td:first-child { color: #8b93a7; width: 120px; }
    .notes { background: #171a21; border-left: 3px solid #4c8dff; padding: 10px 12px; margin: 14px 0; color: #c9d1e2; white-space: pre-wrap; max-height: 150px; overflow: auto; }
    .actions { margin-top: 22px; display: flex; gap: 12px; align-items: center; }
    button { font: inherit; border: 0; border-radius: 8px; padding: 10px 22px; cursor: pointer; }
    #go { background: #4c8dff; color: #fff; font-weight: 600; }
    #go:disabled { background: #2b3a55; color: #8792a8; cursor: default; }
    #quit { background: transparent; color: #8b93a7; text-decoration: underline; padding: 10px 6px; }
    .hint { color: #6f788c; font-size: 12px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">必须更新</div>
    <h1>当前版本低于该环境要求的最低版本，DSH 服务已暂停启动</h1>
    <p>为了让本机继续使用，请先完成更新。更新过程会自动备份当前安装，失败会回滚。</p>
    <table>
      <tr><td>本机版本</td><td id="installed">—</td></tr>
      <tr><td>最低版本</td><td id="minVersion">—</td></tr>
      <tr><td>最新版本</td><td id="latest">—</td></tr>
    </table>
    <div class="notes" id="notes" hidden></div>
    <div class="actions">
      <button id="go">立即更新</button>
      <button id="quit">退出</button>
    </div>
    <div class="hint">更新过程中请勿关闭应用；如需协助请联系运维。</div>
  </div>
  <script>
    const data = window.dshForce ? window.dshForce.data() : {}
    const set = (id, value) => { document.getElementById(id).textContent = value || '—' }
    set('installed', data.installed)
    set('minVersion', data.minVersion)
    set('latest', data.latest)
    if (data.notes) {
      const notes = document.getElementById('notes')
      notes.hidden = false
      notes.textContent = data.notes
    }
    document.getElementById('go').addEventListener('click', () => {
      const button = document.getElementById('go')
      button.disabled = true
      button.textContent = '正在更新…'
      window.dshForce.upgrade()
    })
    document.getElementById('quit').addEventListener('click', () => window.dshForce.quit())
  </script>
</body>
</html>
