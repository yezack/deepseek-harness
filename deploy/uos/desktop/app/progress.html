<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>正在升级 DeepSeek Harness</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0f1115; color: #e6e8ee; font: 13px/1.6 "Noto Sans CJK SC", system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; }
    .box { width: 380px; }
    .title { font-size: 14px; margin-bottom: 12px; }
    .bar { height: 8px; border-radius: 4px; background: #23262e; overflow: hidden; }
    .fill { height: 100%; width: 0%; background: #4c8dff; transition: width .2s ease; }
    .hint { margin-top: 10px; color: #8b93a7; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <div class="box">
    <div class="title" id="title">正在下载升级包…</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="hint" id="hint">请勿关闭应用</div>
  </div>
  <script>
    window.setProgress = (fraction, label) => {
      const pct = Math.max(0, Math.min(1, Number(fraction) || 0)) * 100
      document.getElementById('fill').style.width = pct + '%'
      if (label) document.getElementById('hint').textContent = label
    }
    window.setPhase = (title) => { document.getElementById('title').textContent = title }
  </script>
</body>
</html>
