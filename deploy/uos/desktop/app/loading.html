<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e8ee;
      font: 14px/1.6 "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
    }
    .box { text-align: center; }
    .dot { width: 10px; height: 10px; margin: 0 auto 18px; border-radius: 50%;
      background: #4c8dff; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.85) } 50% { opacity: 1; transform: scale(1.1) } }
    .hint { color: #8b93a7; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="dot"></div>
    <div>正在启动 DeepSeek Harness 服务…</div>
    <div class="hint">首次启动需要十几秒；失败时请查看 ~/.dsh-desktop.log</div>
  </div>
</body>
</html>
